<svg width="860" height="751" viewBox="0 0 860 751" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="3. AD attack surface — everything converges on one point">
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; color: #2C2C2A; background: #FFFFFF; }
  h1 { font-size: 26px; color: #1D4E89; margin-bottom: 4px; }
  .sub { color: #5F5E5A; font-size: 14px; margin-bottom: 40px; }
  h2 { font-size: 19px; color: #222; border-top: 1px solid #E0DED6; padding-top: 32px; margin-top: 40px; }
  p.caption { font-size: 14px; color: #5F5E5A; line-height: 1.6; max-width: 700px; }
  
  .th { font: 500 13px Arial, sans-serif; }
  .ts { font: 400 11px Arial, sans-serif; }
  .arr { stroke:#5F5E5A; stroke-width:1; fill:none; }
  .plain-text { fill:#2C2C2A; }
  .plain-ts   { fill:#5F5E5A; }

  /* light mode */
  .c-gray rect, .c-gray path.shape   { fill:#D3D1C7; stroke:#444441; } .c-gray .th{fill:#2C2C2A} .c-gray .ts{fill:#444441}
  .c-blue rect, .c-blue path.shape   { fill:#B5D4F4; stroke:#0C447C; } .c-blue .th{fill:#042C53} .c-blue .ts{fill:#0C447C}
  .c-red rect, .c-red path.shape    { fill:#F7C1C1; stroke:#791F1F; } .c-red .th{fill:#501313} .c-red .ts{fill:#791F1F}
  .c-teal rect, .c-teal path.shape   { fill:#9FE1CB; stroke:#085041; } .c-teal .th{fill:#04342C} .c-teal .ts{fill:#085041}
  .c-amber rect, .c-amber path.shape  { fill:#FAC775; stroke:#633806; } .c-amber .th{fill:#412402} .c-amber .ts{fill:#633806}
  .c-purple rect, .c-purple path.shape { fill:#CECBF6; stroke:#3C3489; } .c-purple .th{fill:#26215C} .c-purple .ts{fill:#3C3489}
  .c-green rect, .c-green path.shape  { fill:#C0DD97; stroke:#27500A; } .c-green .th{fill:#173404} .c-green .ts{fill:#27500A}
  .c-ghost rect { fill:none; stroke:#B4B2A9; stroke-width:0.75; stroke-dasharray:3 3; } .c-ghost .th{fill:#5F5E5A} .c-ghost .ts{fill:#8A887F}

  @media (prefers-color-scheme: dark) {
    body { background: #1B1B19; color: #E4E2D8; }
    h1 { color: #85B7EB; }
    h2 { color: #E4E2D8; border-top-color: #444441; }
    .sub, p.caption { color: #B4B2A9; }
    .arr { stroke:#B4B2A9; }
    .plain-text { fill:#E4E2D8; }
    .plain-ts   { fill:#B4B2A9; }

    .c-gray rect, .c-gray path.shape   { fill:#444441; stroke:#B4B2A9; } .c-gray .th{fill:#F1EFE8} .c-gray .ts{fill:#D3D1C7}
    .c-blue rect, .c-blue path.shape   { fill:#0C447C; stroke:#85B7EB; } .c-blue .th{fill:#E6F1FB} .c-blue .ts{fill:#B5D4F4}
    .c-red rect, .c-red path.shape    { fill:#791F1F; stroke:#F09595; } .c-red .th{fill:#FCEBEB} .c-red .ts{fill:#F7C1C1}
    .c-teal rect, .c-teal path.shape   { fill:#085041; stroke:#5DCAA5; } .c-teal .th{fill:#E1F5EE} .c-teal .ts{fill:#9FE1CB}
    .c-amber rect, .c-amber path.shape  { fill:#633806; stroke:#EF9F27; } .c-amber .th{fill:#FAEEDA} .c-amber .ts{fill:#FAC775}
    .c-purple rect, .c-purple path.shape { fill:#3C3489; stroke:#AFA9EC; } .c-purple .th{fill:#EEEDFE} .c-purple .ts{fill:#CECBF6}
    .c-green rect, .c-green path.shape  { fill:#27500A; stroke:#97C459; } .c-green .th{fill:#EAF3DE} .c-green .ts{fill:#C0DD97}
    .c-ghost rect { stroke:#6B6A63; } .c-ghost .th{fill:#B4B2A9} .c-ghost .ts{fill:#8A887F}
  }

.hd2{fill:#222} .subtxt{fill:#5F5E5A}
@media (prefers-color-scheme: dark) { .hd2{fill:#E4E2D8} .subtxt{fill:#B4B2A9} }
rect.bgrect{fill:#FFFFFF} @media (prefers-color-scheme: dark) { rect.bgrect{fill:#1B1B19} }</style>
<rect class="bgrect" x="0" y="0" width="860" height="751"/>
<text x="20" y="20" font-size="19" font-weight="600" class="hd2">3. AD attack surface — everything converges on one point</text>
<text x="20" y="46" font-size="13" class="subtxt">Six deliberately planted misconfigurations, each a distinct, real-world attack primitive, all leading to the same place: Domain</text>
<text x="20" y="63" font-size="13" class="subtxt">Admin–equivalent access without ever touching the Domain Admins group directly. This is what BloodHound's shortest-path analysis</text>
<text x="20" y="80" font-size="13" class="subtxt">is built to surface.</text>
<g transform="translate(40.0,111)">
<defs><marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-gray"><rect x="300" y="20" width="180" height="52" rx="8" stroke-width="0.5"/><text class="th" x="390" y="40" text-anchor="middle" dominant-baseline="central">Low-privilege</text><text class="ts" x="390" y="58" text-anchor="middle" dominant-baseline="central">compromised user</text></g>

<line x1="390" y1="72" x2="150" y2="140" class="arr" marker-end="url(#a3)"/>
<g class="c-red"><rect x="40" y="140" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="150" y="158" text-anchor="middle" dominant-baseline="central">Risky ACL</text><text class="ts" x="150" y="176" text-anchor="middle" dominant-baseline="central">GenericAll/WriteDACL on a</text><text class="ts" x="150" y="190" text-anchor="middle" dominant-baseline="central">privileged object (helpdesk tier)</text></g>

<line x1="390" y1="72" x2="150" y2="240" class="arr" marker-end="url(#a3)"/>
<g class="c-amber"><rect x="40" y="240" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="150" y="258" text-anchor="middle" dominant-baseline="central">Unconstrained delegation</text><text class="ts" x="150" y="276" text-anchor="middle" dominant-baseline="central">configured on a server account</text><text class="ts" x="150" y="290" text-anchor="middle" dominant-baseline="central">— Rubeus ticket capture</text></g>

<line x1="390" y1="72" x2="150" y2="340" class="arr" marker-end="url(#a3)"/>
<g class="c-red"><rect x="40" y="340" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="150" y="358" text-anchor="middle" dominant-baseline="central">DCSync rights</text><text class="ts" x="150" y="376" text-anchor="middle" dominant-baseline="central">granted to a non-obvious</text><text class="ts" x="150" y="390" text-anchor="middle" dominant-baseline="central">"backup-svc" account</text></g>

<line x1="390" y1="72" x2="630" y2="140" class="arr" marker-end="url(#a3)"/>
<g class="c-purple"><rect x="520" y="140" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="630" y="158" text-anchor="middle" dominant-baseline="central">ADCS — ESC1</text><text class="ts" x="630" y="176" text-anchor="middle" dominant-baseline="central">vulnerable template, enrollee-</text><text class="ts" x="630" y="190" text-anchor="middle" dominant-baseline="central">supplies-subject — Certipy</text></g>

<line x1="390" y1="72" x2="630" y2="240" class="arr" marker-end="url(#a3)"/>
<g class="c-teal"><rect x="520" y="240" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="630" y="258" text-anchor="middle" dominant-baseline="central">SYSVOL / GPP exposure</text><text class="ts" x="630" y="276" text-anchor="middle" dominant-baseline="central">recoverable credential in a</text><text class="ts" x="630" y="290" text-anchor="middle" dominant-baseline="central">Group Policy Preferences file</text></g>

<line x1="390" y1="72" x2="630" y2="340" class="arr" marker-end="url(#a3)"/>
<g class="c-amber"><rect x="520" y="340" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="630" y="358" text-anchor="middle" dominant-baseline="central">Shadow admin</text><text class="ts" x="630" y="376" text-anchor="middle" dominant-baseline="central">rights via ACL, no group</text><text class="ts" x="630" y="390" text-anchor="middle" dominant-baseline="central">membership — graph-only find</text></g>

<line x1="150" y1="196" x2="300" y2="470" class="arr" marker-end="url(#a3)"/>
<line x1="150" y1="296" x2="330" y2="470" class="arr" marker-end="url(#a3)"/>
<line x1="150" y1="396" x2="360" y2="470" class="arr" marker-end="url(#a3)"/>
<line x1="630" y1="196" x2="480" y2="470" class="arr" marker-end="url(#a3)"/>
<line x1="630" y1="296" x2="450" y2="470" class="arr" marker-end="url(#a3)"/>
<line x1="630" y1="396" x2="420" y2="470" class="arr" marker-end="url(#a3)"/>

<g class="c-red"><rect x="270" y="470" width="240" height="60" rx="8" stroke-width="0.5"/><text class="th" x="390" y="492" text-anchor="middle" dominant-baseline="central">Domain Admin–equivalent</text><text class="ts" x="390" y="510" text-anchor="middle" dominant-baseline="central">access — not group membership</text></g>

<g class="c-ghost"><rect x="90" y="546" width="600" height="56" rx="6" stroke-width="0.75"/><text class="th" x="390" y="564" text-anchor="middle" dominant-baseline="central">Also present, not shown above</text><text class="ts" x="390" y="582" text-anchor="middle" dominant-baseline="central">no LAPS initially (fixed and re-tested mid-chain) — see the kill chain diagram</text></g>
