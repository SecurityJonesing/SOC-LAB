<g class="c-blue"><rect x="484" y="172" width="260" height="76" rx="8" stroke-width="0.5"/><text class="th" x="504" y="196">Exchange Online (Plan 1)</text><text class="ts" x="504" y="216">real mailboxes + Defender for O365</text><text class="ts" x="504" y="232">Attack Simulation Training (phishing)</text></g>

