<path d="M220,248 C 350,320 470,320 600,250" fill="none" stroke="#3C3489" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a4)"/>
<text class="ts plain-ts" x="240" y="330" text-anchor="start">extends the on-prem chain into cloud identity</text>
<text class="ts plain-ts" x="240" y="346" text-anchor="start">enumeration — the deliberate C.6 ↔ C.7 bridge</text>

<g class="c-gray"><rect x="40" y="360" width="700" height="44" rx="8" stroke-width="0.5"/>
