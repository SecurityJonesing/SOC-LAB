<g class="c-red"><rect x="40" y="60" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="130" y="80" text-anchor="middle" dominant-baseline="central">dc01</text><text class="ts" x="130" y="98" text-anchor="middle" dominant-baseline="central">soclab.internal, on RANGE30</text></g>
<line x1="220" y1="88" x2="260" y2="88" class="arr" marker-end="url(#a4)"/>
<g class="c-teal"><rect x="262" y="60" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="352" y="80" text-anchor="middle" dominant-baseline="central">entra-connect-01</text><text class="ts" x="352" y="98" text-anchor="middle" dominant-baseline="central">one-way sync + password hash</text></g>
<line x1="442" y1="88" x2="482" y2="88" class="arr" marker-end="url(#a4)"/>
<g class="c-purple"><rect x="484" y="40" width="260" height="96" rx="8" stroke-width="0.5"/><text class="th" x="504" y="64">Microsoft Entra ID tenant</text><text class="ts" x="504" y="86">Free (permanent) + P1 trial (30 days,</text><text class="ts" x="504" y="102">activated last) — Conditional Access, MFA</text><text class="ts" x="504" y="118">via Microsoft Authenticator</text></g>

