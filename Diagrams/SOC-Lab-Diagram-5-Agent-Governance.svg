<svg width="860" height="691" viewBox="0 0 860 691" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="5. Agent governance — four identities, none of them mine">
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; color: #2C2C2A; background: #FFFFFF; }
  h1 { font-size: 26px; color: #1D4E89; margin-bottom: 4px; }
  .sub { color: #5F5E5A; font-size: 14px; margin-bottom: 40px; }
  h2 { font-size: 19px; color: #222; border-top: 1px solid #E0DED6; padding-top: 32px; margin-top: 40px; }
  p.caption { font-size: 14px; color: #5F5E5A; line-height: 1.6; max-width: 700px; }
  
  .th { font: 500 13px Arial, sans-serif; }
  .ts { font: 400 11px Arial, sans-serif; }
  .arr { stroke:#5F5E5A; stroke-width:1; fill:none; }
  .plain-text { fill:#2C2C2A; }
  .plain-ts   { fill:#5F5E5A; }

  /* light mode */
  .c-gray rect, .c-gray path.shape   { fill:#D3D1C7; stroke:#444441; } .c-gray .th{fill:#2C2C2A} .c-gray .ts{fill:#444441}
  .c-blue rect, .c-blue path.shape   { fill:#B5D4F4; stroke:#0C447C; } .c-blue .th{fill:#042C53} .c-blue .ts{fill:#0C447C}
  .c-red rect, .c-red path.shape    { fill:#F7C1C1; stroke:#791F1F; } .c-red .th{fill:#501313} .c-red .ts{fill:#791F1F}
  .c-teal rect, .c-teal path.shape   { fill:#9FE1CB; stroke:#085041; } .c-teal .th{fill:#04342C} .c-teal .ts{fill:#085041}
  .c-amber rect, .c-amber path.shape  { fill:#FAC775; stroke:#633806; } .c-amber .th{fill:#412402} .c-amber .ts{fill:#633806}
  .c-purple rect, .c-purple path.shape { fill:#CECBF6; stroke:#3C3489; } .c-purple .th{fill:#26215C} .c-purple .ts{fill:#3C3489}
  .c-green rect, .c-green path.shape  { fill:#C0DD97; stroke:#27500A; } .c-green .th{fill:#173404} .c-green .ts{fill:#27500A}
  .c-ghost rect { fill:none; stroke:#B4B2A9; stroke-width:0.75; stroke-dasharray:3 3; } .c-ghost .th{fill:#5F5E5A} .c-ghost .ts{fill:#8A887F}

  @media (prefers-color-scheme: dark) {
    body { background: #1B1B19; color: #E4E2D8; }
    h1 { color: #85B7EB; }
    h2 { color: #E4E2D8; border-top-color: #444441; }
    .sub, p.caption { color: #B4B2A9; }
    .arr { stroke:#B4B2A9; }
    .plain-text { fill:#E4E2D8; }
    .plain-ts   { fill:#B4B2A9; }

    .c-gray rect, .c-gray path.shape   { fill:#444441; stroke:#B4B2A9; } .c-gray .th{fill:#F1EFE8} .c-gray .ts{fill:#D3D1C7}
    .c-blue rect, .c-blue path.shape   { fill:#0C447C; stroke:#85B7EB; } .c-blue .th{fill:#E6F1FB} .c-blue .ts{fill:#B5D4F4}
    .c-red rect, .c-red path.shape    { fill:#791F1F; stroke:#F09595; } .c-red .th{fill:#FCEBEB} .c-red .ts{fill:#F7C1C1}
    .c-teal rect, .c-teal path.shape   { fill:#085041; stroke:#5DCAA5; } .c-teal .th{fill:#E1F5EE} .c-teal .ts{fill:#9FE1CB}
    .c-amber rect, .c-amber path.shape  { fill:#633806; stroke:#EF9F27; } .c-amber .th{fill:#FAEEDA} .c-amber .ts{fill:#FAC775}
    .c-purple rect, .c-purple path.shape { fill:#3C3489; stroke:#AFA9EC; } .c-purple .th{fill:#EEEDFE} .c-purple .ts{fill:#CECBF6}
    .c-green rect, .c-green path.shape  { fill:#27500A; stroke:#97C459; } .c-green .th{fill:#EAF3DE} .c-green .ts{fill:#C0DD97}
    .c-ghost rect { stroke:#6B6A63; } .c-ghost .th{fill:#B4B2A9} .c-ghost .ts{fill:#8A887F}
  }

.hd2{fill:#222} .subtxt{fill:#5F5E5A}
@media (prefers-color-scheme: dark) { .hd2{fill:#E4E2D8} .subtxt{fill:#B4B2A9} }
rect.bgrect{fill:#FFFFFF} @media (prefers-color-scheme: dark) { rect.bgrect{fill:#1B1B19} }</style>
<rect class="bgrect" x="0" y="0" width="860" height="691"/>
<text x="20" y="20" font-size="19" font-weight="600" class="hd2">5. Agent governance — four identities, none of them mine</text>
<text x="20" y="46" font-size="13" class="subtxt">Every non-human actor in this lab gets its own credential, least-privilege scope, and a separate audit trail. wazuh-triage-01 is</text>
<text x="20" y="63" font-size="13" class="subtxt">the specialist; triage-router-01 is the plumbing underneath it. Shuffle and the Entra Connect sync account are registered the same</text>
<text x="20" y="80" font-size="13" class="subtxt">way, even before they're built.</text>
<g transform="translate(40.0,111)">
<defs><marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-purple"><rect x="40" y="20" width="320" height="120" rx="8" stroke-width="0.5"/>
<text class="th" x="60" y="44">wazuh-triage-01 (Phase D)</text>
<text class="ts" x="60" y="66">the specialist</text>
<text class="ts" x="60" y="86">scope: alerts:read, agent:read only</text>
<text class="ts" x="60" y="102">no delete, no config, nothing else</text>
<text class="ts" x="60" y="122">audit: agent=wazuh-triage-01</text>
</g>

<line x1="360" y1="80" x2="410" y2="80" class="arr" marker-end="url(#a5)"/>
<text class="ts plain-ts" x="365" y="70">calls into</text>

<g class="c-blue"><rect x="410" y="20" width="320" height="120" rx="8" stroke-width="0.5"/>
<text class="th" x="430" y="44">triage-router-01 (Phase E)</text>
<text class="ts" x="430" y="66">general plumbing, not Wazuh-specific</text>
<text class="ts" x="430" y="86">routes local (Ollama) vs. cloud (Claude/Grok)</text>
<text class="ts" x="430" y="102">lab/SOC + general automation only</text>
<text class="ts" x="430" y="122">no personal-use routing role</text>
</g>

<g class="c-amber"><rect x="40" y="180" width="320" height="120" rx="8" stroke-width="0.5"/>
<text class="th" x="60" y="204">shuffle-playbook-01 (Phase F)</text>
<text class="ts" x="60" y="226">own Wazuh cred, own VT/AbuseIPDB keys</text>
<text class="ts" x="60" y="242">active-response pfSense cred: one</text>
<text class="ts" x="60" y="258">block-list alias only, if ever enabled</text>
<text class="ts" x="60" y="278">highest-stakes identity if active-</text>
<text class="ts" x="60" y="294">response is turned on</text>
</g>

<g class="c-teal"><rect x="410" y="180" width="320" height="120" rx="8" stroke-width="0.5"/>
<text class="th" x="430" y="204">Entra Connect sync account (C.7)</text>
<text class="ts" x="430" y="226">not an AI agent — same principles apply</text>
<text class="ts" x="430" y="242">minimum AD replication/read only</text>
<text class="ts" x="430" y="258">mirrors the real-world DCSync risk</text>
<text class="ts" x="430" y="278">pattern this lab also demonstrates</text>
<text class="ts" x="430" y="294">offensively elsewhere</text>
</g>

<g class="c-gray"><rect x="40" y="340" width="690" height="200" rx="10" stroke-width="0.5"/>
<text class="th" x="60" y="364">Four governing principles</text>
<text class="ts" x="60" y="392">1. Own identity, not mine — every agent gets a dedicated credential.</text>
<text class="ts" x="60" y="416">2. Least privilege — scope decided before the agent is built, not expanded after.</text>
<text class="ts" x="60" y="440">3. Separate audit trail — an agent's actions and my review of them stay distinguishable.</text>
<text class="ts" x="60" y="464">4. No agent identity uses my name or any identifying detail — generic role labels only.</text>
<text class="ts" x="60" y="500">10:04  agent=wazuh-triage-01  alert=1234  verdict=suspicious</text>
<text class="ts" x="60" y="520">10:07  user=analyst           alert=1234  verdict=benign  override=yes</text>
</g>
</g>
</svg>