<svg width="860" height="574" viewBox="0 0 860 574" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="8. Phase map — what unlocks what">
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; color: #2C2C2A; background: #FFFFFF; }
  h1 { font-size: 26px; color: #1D4E89; margin-bottom: 4px; }
  .sub { color: #5F5E5A; font-size: 14px; margin-bottom: 40px; }
  h2 { font-size: 19px; color: #222; border-top: 1px solid #E0DED6; padding-top: 32px; margin-top: 40px; }
  p.caption { font-size: 14px; color: #5F5E5A; line-height: 1.6; max-width: 700px; }
  
  .th { font: 500 13px Arial, sans-serif; }
  .ts { font: 400 11px Arial, sans-serif; }
  .arr { stroke:#5F5E5A; stroke-width:1; fill:none; }
  .plain-text { fill:#2C2C2A; }
  .plain-ts   { fill:#5F5E5A; }

  /* light mode */
  .c-gray rect, .c-gray path.shape   { fill:#D3D1C7; stroke:#444441; } .c-gray .th{fill:#2C2C2A} .c-gray .ts{fill:#444441}
  .c-blue rect, .c-blue path.shape   { fill:#B5D4F4; stroke:#0C447C; } .c-blue .th{fill:#042C53} .c-blue .ts{fill:#0C447C}
  .c-red rect, .c-red path.shape    { fill:#F7C1C1; stroke:#791F1F; } .c-red .th{fill:#501313} .c-red .ts{fill:#791F1F}
  .c-teal rect, .c-teal path.shape   { fill:#9FE1CB; stroke:#085041; } .c-teal .th{fill:#04342C} .c-teal .ts{fill:#085041}
  .c-amber rect, .c-amber path.shape  { fill:#FAC775; stroke:#633806; } .c-amber .th{fill:#412402} .c-amber .ts{fill:#633806}
  .c-purple rect, .c-purple path.shape { fill:#CECBF6; stroke:#3C3489; } .c-purple .th{fill:#26215C} .c-purple .ts{fill:#3C3489}
  .c-green rect, .c-green path.shape  { fill:#C0DD97; stroke:#27500A; } .c-green .th{fill:#173404} .c-green .ts{fill:#27500A}
  .c-ghost rect { fill:none; stroke:#B4B2A9; stroke-width:0.75; stroke-dasharray:3 3; } .c-ghost .th{fill:#5F5E5A} .c-ghost .ts{fill:#8A887F}

  @media (prefers-color-scheme: dark) {
    body { background: #1B1B19; color: #E4E2D8; }
    h1 { color: #85B7EB; }
    h2 { color: #E4E2D8; border-top-color: #444441; }
    .sub, p.caption { color: #B4B2A9; }
    .arr { stroke:#B4B2A9; }
    .plain-text { fill:#E4E2D8; }
    .plain-ts   { fill:#B4B2A9; }

    .c-gray rect, .c-gray path.shape   { fill:#444441; stroke:#B4B2A9; } .c-gray .th{fill:#F1EFE8} .c-gray .ts{fill:#D3D1C7}
    .c-blue rect, .c-blue path.shape   { fill:#0C447C; stroke:#85B7EB; } .c-blue .th{fill:#E6F1FB} .c-blue .ts{fill:#B5D4F4}
    .c-red rect, .c-red path.shape    { fill:#791F1F; stroke:#F09595; } .c-red .th{fill:#FCEBEB} .c-red .ts{fill:#F7C1C1}
    .c-teal rect, .c-teal path.shape   { fill:#085041; stroke:#5DCAA5; } .c-teal .th{fill:#E1F5EE} .c-teal .ts{fill:#9FE1CB}
    .c-amber rect, .c-amber path.shape  { fill:#633806; stroke:#EF9F27; } .c-amber .th{fill:#FAEEDA} .c-amber .ts{fill:#FAC775}
    .c-purple rect, .c-purple path.shape { fill:#3C3489; stroke:#AFA9EC; } .c-purple .th{fill:#EEEDFE} .c-purple .ts{fill:#CECBF6}
    .c-green rect, .c-green path.shape  { fill:#27500A; stroke:#97C459; } .c-green .th{fill:#EAF3DE} .c-green .ts{fill:#C0DD97}
    .c-ghost rect { stroke:#6B6A63; } .c-ghost .th{fill:#B4B2A9} .c-ghost .ts{fill:#8A887F}
  }

.hd2{fill:#222} .subtxt{fill:#5F5E5A}
@media (prefers-color-scheme: dark) { .hd2{fill:#E4E2D8} .subtxt{fill:#B4B2A9} }
rect.bgrect{fill:#FFFFFF} @media (prefers-color-scheme: dark) { rect.bgrect{fill:#1B1B19} }</style>
<rect class="bgrect" x="0" y="0" width="860" height="574"/>
<text x="20" y="20" font-size="19" font-weight="600" class="hd2">8. Phase map — what unlocks what</text>
<text x="20" y="46" font-size="13" class="subtxt">A.5 must pass before C — no attack code on an unfenced network. B must pass before C — no SIEM, nothing to detect with. C.6/C.7</text>
<text x="20" y="63" font-size="13" class="subtxt">are locked, deliberately-reduced scope. G is deferred, attempted only once F and E are stable.</text>
<g transform="translate(40.0,94)">
<defs><marker id="a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-red"><rect x="20" y="60" width="82" height="56" rx="8" stroke-width="0.5"/><text class="th" x="61" y="80" text-anchor="middle" dominant-baseline="central">A</text><text class="ts" x="61" y="98" text-anchor="middle" dominant-baseline="central">network</text></g>
<line x1="102" y1="88" x2="112" y2="88" class="arr" marker-end="url(#a8)"/>
<g class="c-red"><rect x="114" y="60" width="82" height="56" rx="8" stroke-width="0.5"/><text class="th" x="155" y="80" text-anchor="middle" dominant-baseline="central">A.5</text><text class="ts" x="155" y="98" text-anchor="middle" dominant-baseline="central">isolate</text></g>
<line x1="196" y1="88" x2="206" y2="88" class="arr" marker-end="url(#a8)"/>
<g class="c-amber"><rect x="208" y="60" width="82" height="56" rx="8" stroke-width="0.5"/><text class="th" x="249" y="80" text-anchor="middle" dominant-baseline="central">B</text><text class="ts" x="249" y="98" text-anchor="middle" dominant-baseline="central">Wazuh</text></g>
<line x1="290" y1="88" x2="300" y2="88" class="arr" marker-end="url(#a8)"/>
<g class="c-amber"><rect x="302" y="60" width="82" height="56" rx="8" stroke-width="0.5"/><text class="th" x="343" y="80" text-anchor="middle" dominant-baseline="central">C</text><text class="ts" x="343" y="98" text-anchor="middle" dominant-baseline="central">detect</text></g>
<line x1="384" y1="88" x2="394" y2="88" class="arr" marker-end="url(#a8)"/>
<g class="c-red"><rect x="396" y="60" width="82" height="56" rx="8" stroke-width="0.5"/><text class="th" x="437" y="80" text-anchor="middle" dominant-baseline="central">C.5</text><text class="ts" x="437" y="98" text-anchor="middle" dominant-baseline="central">SPAN</text></g>
<line x1="478" y1="88" x2="488" y2="88" class="arr" marker-end="url(#a8)"/>
<g class="c-purple"><rect x="490" y="60" width="90" height="56" rx="8" stroke-width="0.5"/><text class="th" x="535" y="80" text-anchor="middle" dominant-baseline="central">C.6</text><text class="ts" x="535" y="98" text-anchor="middle" dominant-baseline="central">AD + chain</text></g>
<line x1="580" y1="88" x2="590" y2="88" class="arr" marker-end="url(#a8)"/>
<g class="c-purple"><rect x="592" y="60" width="90" height="56" rx="8" stroke-width="0.5"/><text class="th" x="637" y="80" text-anchor="middle" dominant-baseline="central">C.7</text><text class="ts" x="637" y="98" text-anchor="middle" dominant-baseline="central">IAM/Entra</text></g>

<path d="M637,116 L637,150 L100,150 L100,198" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a8)"/>
<g class="c-amber"><rect x="40" y="200" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="220" text-anchor="middle" dominant-baseline="central">D</text><text class="ts" x="100" y="238" text-anchor="middle" dominant-baseline="central">AI triage</text></g>
<line x1="160" y1="228" x2="176" y2="228" class="arr" marker-end="url(#a8)"/>
<g class="c-teal"><rect x="178" y="200" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="238" y="220" text-anchor="middle" dominant-baseline="central">E</text><text class="ts" x="238" y="238" text-anchor="middle" dominant-baseline="central">local AI + n8n</text></g>
<line x1="298" y1="228" x2="314" y2="228" class="arr" marker-end="url(#a8)"/>
<g class="c-amber"><rect x="316" y="200" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="376" y="220" text-anchor="middle" dominant-baseline="central">F</text><text class="ts" x="376" y="238" text-anchor="middle" dominant-baseline="central">SOAR</text></g>
<line x1="436" y1="228" x2="452" y2="228" class="arr" marker-end="url(#a8)"/>
<g class="c-gray"><rect x="454" y="200" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="514" y="220" text-anchor="middle" dominant-baseline="central">G</text><text class="ts" x="514" y="238" text-anchor="middle" dominant-baseline="central">case mgmt</text></g>

<g class="c-gray"><rect x="40" y="290" width="700" height="150" rx="10" stroke-width="0.5"/>
<text class="th" x="60" y="314">Gates that can't be skipped</text>
<text class="ts" x="60" y="336">A.5 must pass before C — no attack code runs on an unfenced network</text>
<text class="ts" x="60" y="356">B must pass before C — no SIEM, nothing to detect with</text>
<text class="ts" x="60" y="376">C.6/C.7 are locked scope: two real hosts, DCSync instead of a dc01 shell, no Caldera</text>
<text class="ts" x="60" y="396">D benefits from C.6's richer alert stream — sequenced after it, not before</text>
<text class="ts" x="60" y="416">G is deferred — attempted only once F and E are stable, on its own dedicated VM</text>
</g>
</g>
</svg>