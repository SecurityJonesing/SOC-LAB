<svg width="860" height="1211" viewBox="0 0 860 1211" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2. The full kill chain — one story, confirmed at every stage">
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; color: #2C2C2A; background: #FFFFFF; }
  h1 { font-size: 26px; color: #1D4E89; margin-bottom: 4px; }
  .sub { color: #5F5E5A; font-size: 14px; margin-bottom: 40px; }
  h2 { font-size: 19px; color: #222; border-top: 1px solid #E0DED6; padding-top: 32px; margin-top: 40px; }
  p.caption { font-size: 14px; color: #5F5E5A; line-height: 1.6; max-width: 700px; }
  
  .th { font: 500 13px Arial, sans-serif; }
  .ts { font: 400 11px Arial, sans-serif; }
  .arr { stroke:#5F5E5A; stroke-width:1; fill:none; }
  .plain-text { fill:#2C2C2A; }
  .plain-ts   { fill:#5F5E5A; }

  /* light mode */
  .c-gray rect, .c-gray path.shape   { fill:#D3D1C7; stroke:#444441; } .c-gray .th{fill:#2C2C2A} .c-gray .ts{fill:#444441}
  .c-blue rect, .c-blue path.shape   { fill:#B5D4F4; stroke:#0C447C; } .c-blue .th{fill:#042C53} .c-blue .ts{fill:#0C447C}
  .c-red rect, .c-red path.shape    { fill:#F7C1C1; stroke:#791F1F; } .c-red .th{fill:#501313} .c-red .ts{fill:#791F1F}
  .c-teal rect, .c-teal path.shape   { fill:#9FE1CB; stroke:#085041; } .c-teal .th{fill:#04342C} .c-teal .ts{fill:#085041}
  .c-amber rect, .c-amber path.shape  { fill:#FAC775; stroke:#633806; } .c-amber .th{fill:#412402} .c-amber .ts{fill:#633806}
  .c-purple rect, .c-purple path.shape { fill:#CECBF6; stroke:#3C3489; } .c-purple .th{fill:#26215C} .c-purple .ts{fill:#3C3489}
  .c-green rect, .c-green path.shape  { fill:#C0DD97; stroke:#27500A; } .c-green .th{fill:#173404} .c-green .ts{fill:#27500A}
  .c-ghost rect { fill:none; stroke:#B4B2A9; stroke-width:0.75; stroke-dasharray:3 3; } .c-ghost .th{fill:#5F5E5A} .c-ghost .ts{fill:#8A887F}

  @media (prefers-color-scheme: dark) {
    body { background: #1B1B19; color: #E4E2D8; }
    h1 { color: #85B7EB; }
    h2 { color: #E4E2D8; border-top-color: #444441; }
    .sub, p.caption { color: #B4B2A9; }
    .arr { stroke:#B4B2A9; }
    .plain-text { fill:#E4E2D8; }
    .plain-ts   { fill:#B4B2A9; }

    .c-gray rect, .c-gray path.shape   { fill:#444441; stroke:#B4B2A9; } .c-gray .th{fill:#F1EFE8} .c-gray .ts{fill:#D3D1C7}
    .c-blue rect, .c-blue path.shape   { fill:#0C447C; stroke:#85B7EB; } .c-blue .th{fill:#E6F1FB} .c-blue .ts{fill:#B5D4F4}
    .c-red rect, .c-red path.shape    { fill:#791F1F; stroke:#F09595; } .c-red .th{fill:#FCEBEB} .c-red .ts{fill:#F7C1C1}
    .c-teal rect, .c-teal path.shape   { fill:#085041; stroke:#5DCAA5; } .c-teal .th{fill:#E1F5EE} .c-teal .ts{fill:#9FE1CB}
    .c-amber rect, .c-amber path.shape  { fill:#633806; stroke:#EF9F27; } .c-amber .th{fill:#FAEEDA} .c-amber .ts{fill:#FAC775}
    .c-purple rect, .c-purple path.shape { fill:#3C3489; stroke:#AFA9EC; } .c-purple .th{fill:#EEEDFE} .c-purple .ts{fill:#CECBF6}
    .c-green rect, .c-green path.shape  { fill:#27500A; stroke:#97C459; } .c-green .th{fill:#EAF3DE} .c-green .ts{fill:#C0DD97}
    .c-ghost rect { stroke:#6B6A63; } .c-ghost .th{fill:#B4B2A9} .c-ghost .ts{fill:#8A887F}
  }

.hd2{fill:#222} .subtxt{fill:#5F5E5A}
@media (prefers-color-scheme: dark) { .hd2{fill:#E4E2D8} .subtxt{fill:#B4B2A9} }
rect.bgrect{fill:#FFFFFF} @media (prefers-color-scheme: dark) { rect.bgrect{fill:#1B1B19} }</style>
<rect class="bgrect" x="0" y="0" width="860" height="1211"/>
<text x="20" y="20" font-size="19" font-weight="600" class="hd2">2. The full kill chain — one story, confirmed at every stage</text>
<text x="20" y="46" font-size="13" class="subtxt">Every stage runs manually — no orchestration tool executes this chain autonomously. A Wazuh or Suricata detection is confirmed</text>
<text x="20" y="63" font-size="13" class="subtxt">before moving to the next stage. Scope stops after win11-ws02 is compromised; DCSync provides domain-wide credential material</text>
<text x="20" y="80" font-size="13" class="subtxt">without needing a shell on dc01 itself.</text>
<g transform="translate(40.0,111)">
<defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-red"><rect x="60" y="20" width="380" height="64" rx="8" stroke-width="0.5"/><text class="th" x="80" y="44">1. Initial Access</text><text class="ts" x="80" y="64">web app exploit (DVWA/Juice Shop) or WireGuard VPN</text></g>
<g class="c-green"><rect x="460" y="30" width="260" height="44" rx="6" stroke-width="0.5"/><text class="ts" x="475" y="46">Wazuh: web-app/auth alert</text><text class="ts" x="475" y="62">Suricata: exploit traffic on the wire</text></g>
<line x1="440" y1="52" x2="460" y2="52" class="arr" marker-end="url(#a2)"/>
<line x1="250" y1="84" x2="250" y2="104" class="arr" marker-end="url(#a2)"/>

<g class="c-amber"><rect x="60" y="104" width="380" height="64" rx="8" stroke-width="0.5"/><text class="th" x="80" y="128">2. Windows Privilege Escalation</text><text class="ts" x="80" y="148">unquoted service path / weak service perms</text></g>
<g class="c-green"><rect x="460" y="114" width="260" height="44" rx="6" stroke-width="0.5"/><text class="ts" x="475" y="130">Wazuh: local privilege change,</text><text class="ts" x="475" y="146">new SYSTEM-level process</text></g>
<line x1="440" y1="136" x2="460" y2="136" class="arr" marker-end="url(#a2)"/>
<line x1="250" y1="168" x2="250" y2="188" class="arr" marker-end="url(#a2)"/>

<g class="c-purple"><rect x="60" y="188" width="380" height="72" rx="8" stroke-width="0.5"/><text class="th" x="80" y="212">3. Discovery</text><text class="ts" x="80" y="230">SharpHound (session data on) → BloodHound —</text><text class="ts" x="80" y="246">high-value targets, shortest paths, custom Cypher</text></g>
<g class="c-green"><rect x="460" y="200" width="260" height="44" rx="6" stroke-width="0.5"/><text class="ts" x="475" y="216">Wazuh: Advanced Audit Policy</text><text class="ts" x="475" y="232">events — enumeration burst</text></g>
<line x1="440" y1="222" x2="460" y2="222" class="arr" marker-end="url(#a2)"/>
<line x1="250" y1="260" x2="250" y2="280" class="arr" marker-end="url(#a2)"/>

<g class="c-red"><rect x="60" y="280" width="380" height="80" rx="8" stroke-width="0.5"/><text class="th" x="80" y="304">4. Credential / Certificate Access</text><text class="ts" x="80" y="322">Kerberoasting, AS-REP roasting (SPN'd svc account),</text><text class="ts" x="80" y="338">ADCS ESC1 via Certipy, DCSync (no dc01 shell needed)</text></g>
<g class="c-green"><rect x="460" y="296" width="260" height="48" rx="6" stroke-width="0.5"/><text class="ts" x="475" y="312">Wazuh: 4769 encryption-type,</text><text class="ts" x="475" y="328">4662 DCSync access mask</text></g>
<line x1="440" y1="320" x2="460" y2="320" class="arr" marker-end="url(#a2)"/>
<line x1="250" y1="360" x2="250" y2="380" class="arr" marker-end="url(#a2)"/>

<g class="c-amber"><rect x="60" y="380" width="380" height="80" rx="8" stroke-width="0.5"/><text class="th" x="80" y="404">5. Lateral Movement</text><text class="ts" x="80" y="422">host 1 → win11-ws02 via PsExec/WMI/PtH,</text><text class="ts" x="80" y="438">exploiting shared local admin creds (pre-LAPS)</text></g>
<g class="c-green"><rect x="460" y="396" width="260" height="48" rx="6" stroke-width="0.5"/><text class="ts" x="475" y="412">Wazuh: remote service creation,</text><text class="ts" x="475" y="428">new logon type on win11-ws02</text></g>
<line x1="440" y1="420" x2="460" y2="420" class="arr" marker-end="url(#a2)"/>
<line x1="250" y1="460" x2="250" y2="480" class="arr" marker-end="url(#a2)"/>

<g class="c-gray"><rect x="60" y="480" width="380" height="64" rx="8" stroke-width="0.5"/><text class="th" x="80" y="504">6. Persistence</text><text class="ts" x="80" y="524">registry run key / scheduled task, or a persistent Sliver implant</text></g>
<g class="c-green"><rect x="460" y="490" width="260" height="44" rx="6" stroke-width="0.5"/><text class="ts" x="475" y="506">Wazuh FIM / Sysmon:</text><text class="ts" x="475" y="522">new autorun entry</text></g>
<line x1="440" y1="512" x2="460" y2="512" class="arr" marker-end="url(#a2)"/>
<line x1="250" y1="544" x2="250" y2="564" class="arr" marker-end="url(#a2)"/>

<g class="c-teal"><rect x="60" y="564" width="380" height="64" rx="8" stroke-width="0.5"/><text class="th" x="80" y="588">7. Exfiltration</text><text class="ts" x="80" y="608">over-broad file-share ACL → DNS tunneling / HTTPS exfil</text></g>
<g class="c-green"><rect x="460" y="574" width="260" height="44" rx="6" stroke-width="0.5"/><text class="ts" x="475" y="590">Suricata: anomalous DNS</text><text class="ts" x="475" y="606">query volume / odd destination</text></g>
<line x1="440" y1="596" x2="460" y2="596" class="arr" marker-end="url(#a2)"/>
<line x1="250" y1="628" x2="250" y2="648" class="arr" marker-end="url(#a2)"/>

<g class="c-red"><rect x="60" y="648" width="380" height="64" rx="8" stroke-width="0.5"/><text class="th" x="80" y="672">8. Impact</text><text class="ts" x="80" y="692">benign mass file-rename script, ransomware-style</text></g>
<g class="c-green"><rect x="460" y="658" width="260" height="44" rx="6" stroke-width="0.5"/><text class="ts" x="475" y="674">Wazuh FIM: mass rename</text><text class="ts" x="475" y="690">event burst on file share</text></g>
<line x1="440" y1="680" x2="460" y2="680" class="arr" marker-end="url(#a2)"/>

<g class="c-purple"><rect x="60" y="740" width="660" height="80" rx="10" stroke-width="0.5"/>
<text class="th" x="80" y="764">The LAPS before/after</text>
<text class="ts" x="80" y="786">Stage 5's pivot works because local admin creds are reused across hosts.</text>
<text class="ts" x="80" y="802">LAPS is deployed after the chain runs once — the pivot is re-tested and confirmed closed.</text>
</g>

<g class="c-gray"><rect x="60" y="850" width="660" height="200" rx="10" stroke-width="0.5"/>
<text class="th" x="80" y="874">Explicit scope boundary</text>
<text class="ts" x="80" y="898">Stage 4's DCSync gets domain-wide credential material without an interactive</text>
<text class="ts" x="80" y="914">shell on dc01. Full host-level compromise of dc01 — a shell, persistence,</text>
<text class="ts" x="80" y="930">and impact staged directly against the DC — is deliberately out of scope,</text>
<text class="ts" x="80" y="946">documented as a next step, not built.</text>
<text class="ts" x="80" y="978">No Caldera, no autonomous orchestration anywhere in this chain — every</text>
<text class="ts" x="80" y="994">stage above is executed by hand, which is the point: this is a chain run</text>
<text class="ts" x="80" y="1010">myself, end to end, not one configured and watched execute.</text>
</g>
</g>
</svg>