<svg width="760" height="571" viewBox="0 0 760 571" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="6. Why the attack VM went dark — the bridge is a wall socket">
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; color: #2C2C2A; background: #FFFFFF; }
  h1 { font-size: 26px; color: #1D4E89; margin-bottom: 4px; }
  .sub { color: #5F5E5A; font-size: 14px; margin-bottom: 40px; }
  h2 { font-size: 19px; color: #222; border-top: 1px solid #E0DED6; padding-top: 32px; margin-top: 40px; }
  p.caption { font-size: 14px; color: #5F5E5A; line-height: 1.6; max-width: 700px; }
  
  .th { font: 500 13px Arial, sans-serif; }
  .ts { font: 400 11px Arial, sans-serif; }
  .arr { stroke:#5F5E5A; stroke-width:1; fill:none; }
  .plain-text { fill:#2C2C2A; }
  .plain-ts   { fill:#5F5E5A; }

  /* light mode */
  .c-gray rect, .c-gray path.shape   { fill:#D3D1C7; stroke:#444441; } .c-gray .th{fill:#2C2C2A} .c-gray .ts{fill:#444441}
  .c-blue rect, .c-blue path.shape   { fill:#B5D4F4; stroke:#0C447C; } .c-blue .th{fill:#042C53} .c-blue .ts{fill:#0C447C}
  .c-red rect, .c-red path.shape    { fill:#F7C1C1; stroke:#791F1F; } .c-red .th{fill:#501313} .c-red .ts{fill:#791F1F}
  .c-teal rect, .c-teal path.shape   { fill:#9FE1CB; stroke:#085041; } .c-teal .th{fill:#04342C} .c-teal .ts{fill:#085041}
  .c-amber rect, .c-amber path.shape  { fill:#FAC775; stroke:#633806; } .c-amber .th{fill:#412402} .c-amber .ts{fill:#633806}
  .c-purple rect, .c-purple path.shape { fill:#CECBF6; stroke:#3C3489; } .c-purple .th{fill:#26215C} .c-purple .ts{fill:#3C3489}
  .c-green rect, .c-green path.shape  { fill:#C0DD97; stroke:#27500A; } .c-green .th{fill:#173404} .c-green .ts{fill:#27500A}
  .c-ghost rect { fill:none; stroke:#B4B2A9; stroke-width:0.75; stroke-dasharray:3 3; } .c-ghost .th{fill:#5F5E5A} .c-ghost .ts{fill:#8A887F}

  @media (prefers-color-scheme: dark) {
    body { background: #1B1B19; color: #E4E2D8; }
    h1 { color: #85B7EB; }
    h2 { color: #E4E2D8; border-top-color: #444441; }
    .sub, p.caption { color: #B4B2A9; }
    .arr { stroke:#B4B2A9; }
    .plain-text { fill:#E4E2D8; }
    .plain-ts   { fill:#B4B2A9; }

    .c-gray rect, .c-gray path.shape   { fill:#444441; stroke:#B4B2A9; } .c-gray .th{fill:#F1EFE8} .c-gray .ts{fill:#D3D1C7}
    .c-blue rect, .c-blue path.shape   { fill:#0C447C; stroke:#85B7EB; } .c-blue .th{fill:#E6F1FB} .c-blue .ts{fill:#B5D4F4}
    .c-red rect, .c-red path.shape    { fill:#791F1F; stroke:#F09595; } .c-red .th{fill:#FCEBEB} .c-red .ts{fill:#F7C1C1}
    .c-teal rect, .c-teal path.shape   { fill:#085041; stroke:#5DCAA5; } .c-teal .th{fill:#E1F5EE} .c-teal .ts{fill:#9FE1CB}
    .c-amber rect, .c-amber path.shape  { fill:#633806; stroke:#EF9F27; } .c-amber .th{fill:#FAEEDA} .c-amber .ts{fill:#FAC775}
    .c-purple rect, .c-purple path.shape { fill:#3C3489; stroke:#AFA9EC; } .c-purple .th{fill:#EEEDFE} .c-purple .ts{fill:#CECBF6}
    .c-green rect, .c-green path.shape  { fill:#27500A; stroke:#97C459; } .c-green .th{fill:#EAF3DE} .c-green .ts{fill:#C0DD97}
    .c-ghost rect { stroke:#6B6A63; } .c-ghost .th{fill:#B4B2A9} .c-ghost .ts{fill:#8A887F}
  }

.hd2{fill:#222} .subtxt{fill:#5F5E5A}
@media (prefers-color-scheme: dark) { .hd2{fill:#E4E2D8} .subtxt{fill:#B4B2A9} }
rect.bgrect{fill:#FFFFFF} @media (prefers-color-scheme: dark) { rect.bgrect{fill:#1B1B19} }</style>
<rect class="bgrect" x="0" y="0" width="760" height="571"/>
<text x="20" y="20" font-size="19" font-weight="600" class="hd2">6. Why the attack VM went dark — the bridge is a wall socket</text>
<text x="20" y="46" font-size="13" class="subtxt">A VM plugs into a bridge, not a NIC. Move the bridge's uplink cable to a different NIC, and every VM still pointed</text>
<text x="20" y="63" font-size="13" class="subtxt">at the old bridge goes dark — silently, with no error anywhere. Kept from the original diagram set — the lesson is</text>
<text x="20" y="80" font-size="13" class="subtxt">foundational and still applies to every VM in this lab.</text>
<g transform="translate(40.0,111)">
<defs><marker id="a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="40" y="40" width="280" height="32" rx="6" stroke-width="0.5"/><text class="th" x="180" y="56" text-anchor="middle" dominant-baseline="central">before — cable in NIC2</text></g>
<g class="c-red"><rect x="360" y="40" width="280" height="32" rx="6" stroke-width="0.5"/><text class="th" x="500" y="56" text-anchor="middle" dominant-baseline="central">after — cable moved to NIC1</text></g>
<g class="c-gray"><rect x="40" y="90" width="120" height="40" rx="8" stroke-width="0.5"/><text class="th" x="100" y="110" text-anchor="middle" dominant-baseline="central">Attack VM</text></g>
<line x1="100" y1="130" x2="100" y2="150" class="arr" marker-end="url(#a6)"/>
<g class="c-amber"><rect x="40" y="150" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="100" y="168" text-anchor="middle" dominant-baseline="central">vmbr0</text><text class="ts" x="100" y="186" text-anchor="middle" dominant-baseline="central">the socket</text></g>
<line x1="100" y1="202" x2="100" y2="222" class="arr" marker-end="url(#a6)"/>
<g class="c-teal"><rect x="40" y="222" width="120" height="40" rx="8" stroke-width="0.5"/><text class="th" x="100" y="238" text-anchor="middle" dominant-baseline="central">NIC2</text><text class="ts" x="100" y="256" text-anchor="middle" dominant-baseline="central">cable here</text></g>
<g class="c-gray"><rect x="200" y="150" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="260" y="168" text-anchor="middle" dominant-baseline="central">vmbr1</text><text class="ts" x="260" y="186" text-anchor="middle" dominant-baseline="central">management</text></g>
<rect x="200" y="222" width="120" height="40" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts plain-ts" x="260" y="242" text-anchor="middle" dominant-baseline="central">NIC1 — no cable</text>
<text class="ts plain-ts" x="180" y="280" text-anchor="middle">everything is on vmbr0 — it works</text>
<g class="c-gray"><rect x="360" y="90" width="120" height="40" rx="8" stroke-width="0.5"/><text class="th" x="420" y="110" text-anchor="middle" dominant-baseline="central">Attack VM</text></g>
<line x1="420" y1="130" x2="420" y2="150" class="arr" marker-end="url(#a6)"/>
<g class="c-gray"><rect x="360" y="150" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="420" y="168" text-anchor="middle" dominant-baseline="central">vmbr0</text><text class="ts" x="420" y="186" text-anchor="middle" dominant-baseline="central">the socket</text></g>
<line x1="420" y1="202" x2="420" y2="222" class="arr" marker-end="url(#a6)"/>
<rect x="360" y="222" width="120" height="40" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts plain-ts" x="420" y="242" text-anchor="middle" dominant-baseline="central">NIC2 — cable gone</text>
<g class="c-amber"><rect x="520" y="150" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="580" y="168" text-anchor="middle" dominant-baseline="central">vmbr1</text><text class="ts" x="580" y="186" text-anchor="middle" dominant-baseline="central">management</text></g>
<line x1="580" y1="202" x2="580" y2="222" class="arr" marker-end="url(#a6)"/>
<g class="c-teal"><rect x="520" y="222" width="120" height="40" rx="8" stroke-width="0.5"/><text class="th" x="580" y="238" text-anchor="middle" dominant-baseline="central">NIC1</text><text class="ts" x="580" y="256" text-anchor="middle" dominant-baseline="central">cable now here</text></g>
<text class="ts plain-ts" x="500" y="280" text-anchor="middle">Attack VM is still plugged into a dead socket</text>
<g class="c-gray"><rect x="40" y="320" width="600" height="80" rx="10" stroke-width="0.5"/>
<text class="th" x="60" y="344">The lesson</text>
<text class="ts" x="60" y="366">Moving the wire behind the wall does not move the lamp.</text>
<text class="ts" x="60" y="384">A VM plugs into a bridge, not a NIC — move the bridge's uplink and it goes dark, silently.</text></g>
</g>
</svg>