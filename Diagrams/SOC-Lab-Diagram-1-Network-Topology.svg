<svg width="980" height="891" viewBox="0 0 980 891" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="1. Lab network topology">
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; color: #2C2C2A; background: #FFFFFF; }
  h1 { font-size: 26px; color: #1D4E89; margin-bottom: 4px; }
  .sub { color: #5F5E5A; font-size: 14px; margin-bottom: 40px; }
  h2 { font-size: 19px; color: #222; border-top: 1px solid #E0DED6; padding-top: 32px; margin-top: 40px; }
  p.caption { font-size: 14px; color: #5F5E5A; line-height: 1.6; max-width: 700px; }
  
  .th { font: 500 13px Arial, sans-serif; }
  .ts { font: 400 11px Arial, sans-serif; }
  .arr { stroke:#5F5E5A; stroke-width:1; fill:none; }
  .plain-text { fill:#2C2C2A; }
  .plain-ts   { fill:#5F5E5A; }

  /* light mode */
  .c-gray rect, .c-gray path.shape   { fill:#D3D1C7; stroke:#444441; } .c-gray .th{fill:#2C2C2A} .c-gray .ts{fill:#444441}
  .c-blue rect, .c-blue path.shape   { fill:#B5D4F4; stroke:#0C447C; } .c-blue .th{fill:#042C53} .c-blue .ts{fill:#0C447C}
  .c-red rect, .c-red path.shape    { fill:#F7C1C1; stroke:#791F1F; } .c-red .th{fill:#501313} .c-red .ts{fill:#791F1F}
  .c-teal rect, .c-teal path.shape   { fill:#9FE1CB; stroke:#085041; } .c-teal .th{fill:#04342C} .c-teal .ts{fill:#085041}
  .c-amber rect, .c-amber path.shape  { fill:#FAC775; stroke:#633806; } .c-amber .th{fill:#412402} .c-amber .ts{fill:#633806}
  .c-purple rect, .c-purple path.shape { fill:#CECBF6; stroke:#3C3489; } .c-purple .th{fill:#26215C} .c-purple .ts{fill:#3C3489}
  .c-green rect, .c-green path.shape  { fill:#C0DD97; stroke:#27500A; } .c-green .th{fill:#173404} .c-green .ts{fill:#27500A}
  .c-ghost rect { fill:none; stroke:#B4B2A9; stroke-width:0.75; stroke-dasharray:3 3; } .c-ghost .th{fill:#5F5E5A} .c-ghost .ts{fill:#8A887F}

  @media (prefers-color-scheme: dark) {
    body { background: #1B1B19; color: #E4E2D8; }
    h1 { color: #85B7EB; }
    h2 { color: #E4E2D8; border-top-color: #444441; }
    .sub, p.caption { color: #B4B2A9; }
    .arr { stroke:#B4B2A9; }
    .plain-text { fill:#E4E2D8; }
    .plain-ts   { fill:#B4B2A9; }

    .c-gray rect, .c-gray path.shape   { fill:#444441; stroke:#B4B2A9; } .c-gray .th{fill:#F1EFE8} .c-gray .ts{fill:#D3D1C7}
    .c-blue rect, .c-blue path.shape   { fill:#0C447C; stroke:#85B7EB; } .c-blue .th{fill:#E6F1FB} .c-blue .ts{fill:#B5D4F4}
    .c-red rect, .c-red path.shape    { fill:#791F1F; stroke:#F09595; } .c-red .th{fill:#FCEBEB} .c-red .ts{fill:#F7C1C1}
    .c-teal rect, .c-teal path.shape   { fill:#085041; stroke:#5DCAA5; } .c-teal .th{fill:#E1F5EE} .c-teal .ts{fill:#9FE1CB}
    .c-amber rect, .c-amber path.shape  { fill:#633806; stroke:#EF9F27; } .c-amber .th{fill:#FAEEDA} .c-amber .ts{fill:#FAC775}
    .c-purple rect, .c-purple path.shape { fill:#3C3489; stroke:#AFA9EC; } .c-purple .th{fill:#EEEDFE} .c-purple .ts{fill:#CECBF6}
    .c-green rect, .c-green path.shape  { fill:#27500A; stroke:#97C459; } .c-green .th{fill:#EAF3DE} .c-green .ts{fill:#C0DD97}
    .c-ghost rect { stroke:#6B6A63; } .c-ghost .th{fill:#B4B2A9} .c-ghost .ts{fill:#8A887F}
  }

.hd2{fill:#222} .subtxt{fill:#5F5E5A}
@media (prefers-color-scheme: dark) { .hd2{fill:#E4E2D8} .subtxt{fill:#B4B2A9} }
rect.bgrect{fill:#FFFFFF} @media (prefers-color-scheme: dark) { rect.bgrect{fill:#1B1B19} }</style>
<rect class="bgrect" x="0" y="0" width="980" height="891"/>
<text x="20" y="20" font-size="19" font-weight="600" class="hd2">1. Lab network topology</text>
<text x="20" y="46" font-size="13" class="subtxt">Every packet crosses pfSense on the way between VLANs. Two deliberate exceptions exist in an otherwise default-deny Range fence: the green line</text>
<text x="20" y="63" font-size="13" class="subtxt">(Wazuh log ingest, existing since Phase A.5) and the amber line (Entra Connect sync, the one INFRA20→RANGE30 exception, narrow and reviewed). The</text>
<text x="20" y="80" font-size="13" class="subtxt">dashed boxes are phantom AD computer objects — directory entries, not live VMs.</text>
<g transform="translate(40.0,111)">
<defs><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="360" y="20" width="180" height="40" rx="8" stroke-width="0.5"/><text class="th" x="450" y="40" text-anchor="middle" dominant-baseline="central">Internet</text></g>
<line x1="450" y1="60" x2="450" y2="78" class="arr" marker-end="url(#a1)"/>
<g class="c-gray"><rect x="360" y="78" width="180" height="48" rx="8" stroke-width="0.5"/><text class="th" x="450" y="96" text-anchor="middle" dominant-baseline="central">Home router</text><text class="ts" x="450" y="112" text-anchor="middle" dominant-baseline="central">192.168.0.1 · DHCP</text></g>
<line x1="450" y1="126" x2="450" y2="146" class="arr" marker-end="url(#a1)"/>
<g class="c-gray"><rect x="360" y="146" width="180" height="48" rx="8" stroke-width="0.5"/><text class="th" x="450" y="164" text-anchor="middle" dominant-baseline="central">Dumb switch</text><text class="ts" x="450" y="180" text-anchor="middle" dominant-baseline="central">at the desk</text></g>
<line x1="360" y1="170" x2="220" y2="170" class="arr" marker-end="url(#a1)"/>
<g class="c-gray"><rect x="60" y="146" width="160" height="48" rx="8" stroke-width="0.5"/><text class="th" x="140" y="164" text-anchor="middle" dominant-baseline="central">Management PC</text><text class="ts" x="140" y="180" text-anchor="middle" dominant-baseline="central">USB-Ethernet lab link</text></g>
<g class="c-purple"><rect x="620" y="146" width="220" height="60" rx="8" stroke-width="0.5"/><text class="th" x="730" y="166" text-anchor="middle" dominant-baseline="central">External VPN client</text><text class="ts" x="730" y="184" text-anchor="middle" dominant-baseline="central">WireGuard remote-access —</text><text class="ts" x="730" y="198" text-anchor="middle" dominant-baseline="central">a second credential-based entry point</text></g>
<line x1="450" y1="194" x2="450" y2="214" class="arr" marker-end="url(#a1)"/>
<g class="c-amber"><rect x="360" y="214" width="180" height="48" rx="8" stroke-width="0.5"/><text class="th" x="450" y="232" text-anchor="middle" dominant-baseline="central">pfSense VM</text><text class="ts" x="450" y="248" text-anchor="middle" dominant-baseline="central">the one chokepoint + VPN</text></g>
<line x1="620" y1="176" x2="540" y2="230" class="arr" marker-end="url(#a1)"/>
<line x1="450" y1="262" x2="450" y2="290" class="arr" marker-end="url(#a1)"/>
<g class="c-gray"><rect x="360" y="290" width="180" height="48" rx="8" stroke-width="0.5"/><text class="th" x="450" y="308" text-anchor="middle" dominant-baseline="central">Cisco switch</text><text class="ts" x="450" y="324" text-anchor="middle" dominant-baseline="central">VLAN trunk + SPAN</text></g>
<line x1="450" y1="338" x2="450" y2="352" class="arr"/>
<line x1="150" y1="352" x2="800" y2="352" class="arr"/>
<line x1="150" y1="352" x2="150" y2="368" class="arr" marker-end="url(#a1)"/>
<line x1="450" y1="352" x2="450" y2="368" class="arr" marker-end="url(#a1)"/>
<line x1="800" y1="352" x2="800" y2="368" class="arr" marker-end="url(#a1)"/>

<g class="c-blue"><rect x="60" y="370" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="150" y="390" text-anchor="middle" dominant-baseline="central">Management VLAN</text><text class="ts" x="150" y="408" text-anchor="middle" dominant-baseline="central">full admin access</text></g>

<g class="c-teal"><rect x="330" y="370" width="240" height="220" rx="8" stroke-width="0.5"/><text class="th" x="450" y="390" text-anchor="middle" dominant-baseline="central">Infra VLAN (INFRA20)</text>
<text class="ts" x="345" y="412">wazuh-host (Wazuh/Suricata)</text>
<text class="ts" x="345" y="430">entra-connect-01</text>
<text class="ts" x="345" y="448">Shuffle (Phase F)</text>
<text class="ts" x="345" y="466">Open WebUI + n8n</text>
<text class="ts" x="345" y="484">pve-ai inference (lab/SOC only)</text>
<text class="ts" x="345" y="510">scoped outbound: DNS/HTTP/HTTPS/</text>
<text class="ts" x="345" y="526">ICMP/SSH + Entra sync endpoints</text>
<text class="ts" x="345" y="548">↓ one narrow exception below ↓</text>
</g>

<g class="c-red"><rect x="620" y="370" width="220" height="270" rx="8" stroke-width="0.5"/><text class="th" x="730" y="390" text-anchor="middle" dominant-baseline="central">Range VLAN (RANGE30)</text>
<text class="ts" x="635" y="412">Kali (attacker)</text>
<text class="ts" x="635" y="430">Win11-LTSC-victim (host 1)</text>
<text class="ts" x="635" y="448">win11-ws02 (host 2 — pivot target)</text>
<text class="ts" x="635" y="466">dc01 — soclab.internal</text>
<text class="ts" x="635" y="484">linux-victim + vuln web app</text>
</g>
<g class="c-ghost"><rect x="635" y="498" width="190" height="52" rx="6" stroke-width="0.75"/><text class="th" x="730" y="516" text-anchor="middle" dominant-baseline="central">3–4 phantom computer objects</text><text class="ts" x="730" y="534" text-anchor="middle" dominant-baseline="central">directory-only, no live VM</text></g>

<path d="M340,470 L280,470 L280,550 L340,550" fill="none" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a1)"/>
<text class="ts plain-ts" x="290" y="566" text-anchor="start">existing hole — Wazuh</text>
<text class="ts plain-ts" x="290" y="580" text-anchor="start">ingest/enrollment, 1514/1515</text>

<path d="M450,530 L500,530 L500,650 L620,650" fill="none" stroke="#B37D0A" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a1)"/>
<text class="ts plain-ts" x="500" y="668" text-anchor="start">new exception — entra-connect-01 → dc01</text>
<text class="ts plain-ts" x="500" y="682" text-anchor="start">AD sync ports only, first INFRA→RANGE rule</text>

<line x1="800" y1="368" x2="800" y2="384" class="arr" marker-end="url(#a1)"/>
<g class="c-gray"><rect x="700" y="700" width="200" height="48" rx="8" stroke-width="0.5"/><text class="th" x="800" y="718" text-anchor="middle" dominant-baseline="central">SPAN monitor port</text><text class="ts" x="800" y="734" text-anchor="middle" dominant-baseline="central">receive-only, no IP</text></g>

<g class="c-purple"><rect x="60" y="440" width="240" height="80" rx="8" stroke-width="0.5"/><text class="th" x="180" y="460" text-anchor="middle" dominant-baseline="central">Microsoft cloud</text><text class="ts" x="75" y="480">Entra ID (Free + P1 trial)</text><text class="ts" x="75" y="496">Exchange Online Plan 1</text><text class="ts" x="75" y="512">reached via entra-connect-01 + browser</text></g>
<line x1="300" y1="460" x2="330" y2="440" class="arr" marker-end="url(#a1)"/>
</g>
</svg>