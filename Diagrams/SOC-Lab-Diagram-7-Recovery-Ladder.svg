<svg width="760" height="514" viewBox="0 0 760 514" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="7. The recovery ladder — climb down until something works">
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; color: #2C2C2A; background: #FFFFFF; }
  h1 { font-size: 26px; color: #1D4E89; margin-bottom: 4px; }
  .sub { color: #5F5E5A; font-size: 14px; margin-bottom: 40px; }
  h2 { font-size: 19px; color: #222; border-top: 1px solid #E0DED6; padding-top: 32px; margin-top: 40px; }
  p.caption { font-size: 14px; color: #5F5E5A; line-height: 1.6; max-width: 700px; }
  
  .th { font: 500 13px Arial, sans-serif; }
  .ts { font: 400 11px Arial, sans-serif; }
  .arr { stroke:#5F5E5A; stroke-width:1; fill:none; }
  .plain-text { fill:#2C2C2A; }
  .plain-ts   { fill:#5F5E5A; }

  /* light mode */
  .c-gray rect, .c-gray path.shape   { fill:#D3D1C7; stroke:#444441; } .c-gray .th{fill:#2C2C2A} .c-gray .ts{fill:#444441}
  .c-blue rect, .c-blue path.shape   { fill:#B5D4F4; stroke:#0C447C; } .c-blue .th{fill:#042C53} .c-blue .ts{fill:#0C447C}
  .c-red rect, .c-red path.shape    { fill:#F7C1C1; stroke:#791F1F; } .c-red .th{fill:#501313} .c-red .ts{fill:#791F1F}
  .c-teal rect, .c-teal path.shape   { fill:#9FE1CB; stroke:#085041; } .c-teal .th{fill:#04342C} .c-teal .ts{fill:#085041}
  .c-amber rect, .c-amber path.shape  { fill:#FAC775; stroke:#633806; } .c-amber .th{fill:#412402} .c-amber .ts{fill:#633806}
  .c-purple rect, .c-purple path.shape { fill:#CECBF6; stroke:#3C3489; } .c-purple .th{fill:#26215C} .c-purple .ts{fill:#3C3489}
  .c-green rect, .c-green path.shape  { fill:#C0DD97; stroke:#27500A; } .c-green .th{fill:#173404} .c-green .ts{fill:#27500A}
  .c-ghost rect { fill:none; stroke:#B4B2A9; stroke-width:0.75; stroke-dasharray:3 3; } .c-ghost .th{fill:#5F5E5A} .c-ghost .ts{fill:#8A887F}

  @media (prefers-color-scheme: dark) {
    body { background: #1B1B19; color: #E4E2D8; }
    h1 { color: #85B7EB; }
    h2 { color: #E4E2D8; border-top-color: #444441; }
    .sub, p.caption { color: #B4B2A9; }
    .arr { stroke:#B4B2A9; }
    .plain-text { fill:#E4E2D8; }
    .plain-ts   { fill:#B4B2A9; }

    .c-gray rect, .c-gray path.shape   { fill:#444441; stroke:#B4B2A9; } .c-gray .th{fill:#F1EFE8} .c-gray .ts{fill:#D3D1C7}
    .c-blue rect, .c-blue path.shape   { fill:#0C447C; stroke:#85B7EB; } .c-blue .th{fill:#E6F1FB} .c-blue .ts{fill:#B5D4F4}
    .c-red rect, .c-red path.shape    { fill:#791F1F; stroke:#F09595; } .c-red .th{fill:#FCEBEB} .c-red .ts{fill:#F7C1C1}
    .c-teal rect, .c-teal path.shape   { fill:#085041; stroke:#5DCAA5; } .c-teal .th{fill:#E1F5EE} .c-teal .ts{fill:#9FE1CB}
    .c-amber rect, .c-amber path.shape  { fill:#633806; stroke:#EF9F27; } .c-amber .th{fill:#FAEEDA} .c-amber .ts{fill:#FAC775}
    .c-purple rect, .c-purple path.shape { fill:#3C3489; stroke:#AFA9EC; } .c-purple .th{fill:#EEEDFE} .c-purple .ts{fill:#CECBF6}
    .c-green rect, .c-green path.shape  { fill:#27500A; stroke:#97C459; } .c-green .th{fill:#EAF3DE} .c-green .ts{fill:#C0DD97}
    .c-ghost rect { stroke:#6B6A63; } .c-ghost .th{fill:#B4B2A9} .c-ghost .ts{fill:#8A887F}
  }

.hd2{fill:#222} .subtxt{fill:#5F5E5A}
@media (prefers-color-scheme: dark) { .hd2{fill:#E4E2D8} .subtxt{fill:#B4B2A9} }
rect.bgrect{fill:#FFFFFF} @media (prefers-color-scheme: dark) { rect.bgrect{fill:#1B1B19} }</style>
<rect class="bgrect" x="0" y="0" width="760" height="514"/>
<text x="20" y="20" font-size="19" font-weight="600" class="hd2">7. The recovery ladder — climb down until something works</text>
<text x="20" y="46" font-size="13" class="subtxt">Never make a change that could cut off the only access path. Confirm the next rung down works before it's needed —</text>
<text x="20" y="63" font-size="13" class="subtxt">the green rungs are physical and need no network, no config, no Java. That's why they're always the true fallback.</text>
<g transform="translate(40.0,94)">
<defs><marker id="a7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="40" width="380" height="48" rx="8" stroke-width="0.5"/><text class="th" x="60" y="58" dominant-baseline="central">Proxmox web UI</text><text class="ts" x="60" y="76" dominant-baseline="central">192.168.0.201:8006</text></g>
<line x1="230" y1="88" x2="230" y2="100" class="arr" marker-end="url(#a7)"/>
<g class="c-gray"><rect x="40" y="100" width="380" height="48" rx="8" stroke-width="0.5"/><text class="th" x="60" y="118" dominant-baseline="central">SSH to pve01</text><text class="ts" x="60" y="136" dominant-baseline="central">needs the network up</text></g>
<line x1="230" y1="148" x2="230" y2="160" class="arr" marker-end="url(#a7)"/>
<g class="c-blue"><rect x="40" y="160" width="380" height="48" rx="8" stroke-width="0.5"/><text class="th" x="60" y="178" dominant-baseline="central">iDRAC</text><text class="ts" x="60" y="196" dominant-baseline="central">192.168.0.100</text></g>
<line x1="230" y1="208" x2="230" y2="220" class="arr" marker-end="url(#a7)"/>
<g class="c-teal"><rect x="40" y="220" width="380" height="48" rx="8" stroke-width="0.5"/><text class="th" x="60" y="238" dominant-baseline="central">Monitor + keyboard</text><text class="ts" x="60" y="256" dominant-baseline="central">directly on the R710</text></g>
<line x1="230" y1="268" x2="230" y2="280" class="arr" marker-end="url(#a7)"/>
<g class="c-teal"><rect x="40" y="280" width="380" height="48" rx="8" stroke-width="0.5"/><text class="th" x="60" y="298" dominant-baseline="central">PuTTY serial</text><text class="ts" x="60" y="316" dominant-baseline="central">Cisco switch console</text></g>
<line x1="230" y1="328" x2="230" y2="340" class="arr" marker-end="url(#a7)"/>
<g class="c-teal"><rect x="40" y="340" width="380" height="48" rx="8" stroke-width="0.5"/><text class="th" x="60" y="358" dominant-baseline="central">Snapshot / config restore</text><text class="ts" x="60" y="376" dominant-baseline="central">the undo button</text></g>
<g class="c-red"><rect x="440" y="40" width="200" height="188" rx="8" stroke-width="0.5"/>
<text class="th" x="460" y="64">The rule</text>
<text class="ts" x="460" y="88"><tspan x="460" dy="0">Never make a change</tspan><tspan x="460" dy="18">that could cut off</tspan><tspan x="460" dy="18">the only access path.</tspan></text>
<text class="ts" x="460" y="168"><tspan x="460" dy="0">Confirm the next rung</tspan><tspan x="460" dy="18">works first — tested,</tspan><tspan x="460" dy="18">not assumed.</tspan></text>
</g>
<g class="c-teal"><rect x="440" y="240" width="200" height="148" rx="8" stroke-width="0.5"/>
<text class="th" x="460" y="264">Green = physical</text>
<text class="ts" x="460" y="288"><tspan x="460" dy="0">Needs no network, no</tspan><tspan x="460" dy="18">config, no Java. This</tspan><tspan x="460" dy="18">is why real risks up top</tspan><tspan x="460" dy="18">are affordable.</tspan></text>
</g>
</g>
</svg>