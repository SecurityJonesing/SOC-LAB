<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>SOC lab network architecture</title>
<desc>Home router down through a dumb switch (with a branch to the management PC), pfSense VM, and the Cisco Catalyst trunk switch, which fans out into four VLANs: MGMT10, INFRA20, RANGE30, and a passive SPAN monitor.</desc>

<style>
  :root { color-scheme: light dark; }

  .bg { fill:#ffffff; }
  .arrow-line { stroke:#5F5E5A; }
  .arrow-line-muted { stroke:#888780; }

  .box-neutral { fill:#F1EFE8; stroke:#5F5E5A; }
  .box-neutral-muted { fill:#F1EFE8; stroke:#888780; }
  .box-blue { fill:#E6F1FB; stroke:#185FA5; }
  .box-red { fill:#FAECE7; stroke:#993C1D; }
  .box-teal { fill:#E1F5EE; stroke:#0F6E56; }

  .t-title { fill:#2C2C2A; }
  .t-sub { fill:#5F5E5A; }
  .t-blue-title { fill:#042C53; }
  .t-blue-sub { fill:#185FA5; }
  .t-blue-sub2 { fill:#0C447C; }
  .t-red-title { fill:#4A1B0C; }
  .t-red-sub { fill:#712B13; }
  .t-teal-title { fill:#04342C; }
  .t-teal-sub { fill:#085041; }

  @media (prefers-color-scheme: dark) {
    .bg { fill:#1B1B19; }
    .arrow-line { stroke:#B4B2A9; }
    .arrow-line-muted { stroke:#8A887F; }

    .box-neutral { fill:#3A3934; stroke:#B4B2A9; }
    .box-neutral-muted { fill:#3A3934; stroke:#8A887F; }
    .box-blue { fill:#0C2E4F; stroke:#4A9FE0; }
    .box-red { fill:#3D160A; stroke:#C97A54; }
    .box-teal { fill:#06342A; stroke:#3FA98A; }

    .t-title { fill:#F1EFE8; }
    .t-sub { fill:#D3D1C7; }
    .t-blue-title { fill:#E6F1FB; }
    .t-blue-sub { fill:#85B7EB; }
    .t-blue-sub2 { fill:#9FCBF5; }
    .t-red-title { fill:#FAECE7; }
    .t-red-sub { fill:#E0916A; }
    .t-teal-title { fill:#E1F5EE; }
    .t-teal-sub { fill:#5DCAA5; }
  }
</style>

<rect x="0" y="0" width="1000" height="700" class="bg"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" class="arrow-line" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="500" y1="90" x2="500" y2="140" class="arrow-line" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="500" y1="190" x2="500" y2="230" class="arrow-line" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="500" y1="290" x2="500" y2="330" class="arrow-line" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="590" y1="165" x2="700" y2="165" class="arrow-line-muted" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="500" y1="390" x2="500" y2="410" class="arrow-line" stroke-width="1.5"/>
<line x1="155" y1="410" x2="845" y2="410" class="arrow-line" stroke-width="1.5"/>
<line x1="155" y1="410" x2="155" y2="430" class="arrow-line" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="385" y1="410" x2="385" y2="430" class="arrow-line" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="615" y1="410" x2="615" y2="430" class="arrow-line" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="845" y1="410" x2="845" y2="430" class="arrow-line" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="390" y="40" width="220" height="50" rx="8" class="box-neutral" stroke-width="0.75"/>
<text x="500" y="59" text-anchor="middle" font-size="14" font-weight="700" class="t-title">Home router</text>
<text x="500" y="77" text-anchor="middle" font-size="12" class="t-sub">192.168.0.1</text>
</g>

<g>
<rect x="410" y="140" width="180" height="50" rx="8" class="box-neutral" stroke-width="0.75"/>
<text x="500" y="170" text-anchor="middle" font-size="14" font-weight="700" class="t-title">Dumb switch</text>
</g>

<g>
<rect x="700" y="140" width="220" height="50" rx="8" class="box-neutral-muted" stroke-width="0.75"/>
<text x="810" y="159" text-anchor="middle" font-size="13" font-weight="700" class="t-title">Management PC</text>
<text x="810" y="176" text-anchor="middle" font-size="11" class="t-sub">dedicated USB-Ethernet</text>
</g>

<g>
<rect x="360" y="230" width="280" height="60" rx="8" class="box-blue" stroke-width="0.75"/>
<text x="500" y="255" text-anchor="middle" font-size="14" font-weight="700" class="t-blue-title">pfSense VM (pve01)</text>
<text x="500" y="274" text-anchor="middle" font-size="12" class="t-blue-sub">+ WireGuard remote-access VPN</text>
</g>

<g>
<rect x="360" y="330" width="280" height="60" rx="8" class="box-neutral" stroke-width="0.75"/>
<text x="500" y="355" text-anchor="middle" font-size="14" font-weight="700" class="t-title">Cisco Catalyst switch</text>
<text x="500" y="374" text-anchor="middle" font-size="12" class="t-sub">802.1Q trunk</text>
</g>

<g>
<rect x="50" y="430" width="210" height="220" rx="10" class="box-neutral-muted" stroke-width="0.75"/>
<text x="155" y="460" text-anchor="middle" font-size="14" font-weight="700" class="t-title">MGMT10</text>
<text x="155" y="485" text-anchor="middle" font-size="12" class="t-sub">(mgmt)</text>
</g>

<g>
<rect x="280" y="430" width="210" height="220" rx="10" class="box-blue" stroke-width="0.75"/>
<text x="385" y="460" text-anchor="middle" font-size="14" font-weight="700" class="t-blue-title">INFRA20</text>
<text x="385" y="485" text-anchor="middle" font-size="12" class="t-blue-sub2">Docker / Wazuh</text>
<text x="385" y="505" text-anchor="middle" font-size="12" class="t-blue-sub2">Suricata</text>
<text x="385" y="525" text-anchor="middle" font-size="12" class="t-blue-sub2">Shuffle / n8n</text>
<text x="385" y="545" text-anchor="middle" font-size="12" class="t-blue-sub2">entra-connect-01</text>
<text x="385" y="565" text-anchor="middle" font-size="12" class="t-blue-sub2">+ pve-ai inference</text>
</g>

<g>
<rect x="510" y="430" width="210" height="220" rx="10" class="box-red" stroke-width="0.75"/>
<text x="615" y="460" text-anchor="middle" font-size="14" font-weight="700" class="t-red-title">RANGE30</text>
<text x="615" y="485" text-anchor="middle" font-size="12" class="t-red-sub">Kali</text>
<text x="615" y="505" text-anchor="middle" font-size="12" class="t-red-sub">Win11-LTSC-victim</text>
<text x="615" y="525" text-anchor="middle" font-size="12" class="t-red-sub">win11-ws02</text>
<text x="615" y="545" text-anchor="middle" font-size="12" class="t-red-sub">dc01</text>
<text x="615" y="565" text-anchor="middle" font-size="12" class="t-red-sub">linux-victim</text>
<text x="615" y="585" text-anchor="middle" font-size="12" class="t-red-sub">+ phantom computer objects</text>
</g>

<g>
<rect x="740" y="430" width="210" height="220" rx="10" class="box-teal" stroke-width="0.75"/>
<text x="845" y="460" text-anchor="middle" font-size="14" font-weight="700" class="t-teal-title">SPAN monitor</text>
<text x="845" y="485" text-anchor="middle" font-size="12" class="t-teal-sub">Mirrors Range traffic</text>
<text x="845" y="505" text-anchor="middle" font-size="12" class="t-teal-sub">-&gt; Suricata</text>
<text x="845" y="525" text-anchor="middle" font-size="12" class="t-teal-sub">passive / no IP</text>
</g>

</svg>
