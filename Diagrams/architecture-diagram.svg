<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>SOC lab network architecture</title>
<desc>Home router down through a dumb switch (with a branch to the management PC), pfSense VM, and the Cisco Catalyst trunk switch, which fans out into four VLANs: MGMT10, INFRA20, RANGE30, and a passive SPAN monitor.</desc>

<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="500" y1="90" x2="500" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="500" y1="190" x2="500" y2="230" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="500" y1="290" x2="500" y2="330" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="590" y1="165" x2="700" y2="165" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="500" y1="390" x2="500" y2="410" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="155" y1="410" x2="845" y2="410" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="155" y1="410" x2="155" y2="430" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="385" y1="410" x2="385" y2="430" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="615" y1="410" x2="615" y2="430" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="845" y1="410" x2="845" y2="430" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="390" y="40" width="220" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="500" y="59" text-anchor="middle" font-size="14" font-weight="700" fill="#2C2C2A">Home router</text>
<text x="500" y="77" text-anchor="middle" font-size="12" fill="#5F5E5A">192.168.0.1</text>
</g>

<g>
<rect x="410" y="140" width="180" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="500" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#2C2C2A">Dumb switch</text>
</g>

<g>
<rect x="700" y="140" width="220" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="810" y="159" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2C2A">Management PC</text>
<text x="810" y="176" text-anchor="middle" font-size="11" fill="#5F5E5A">dedicated USB-Ethernet</text>
</g>

<g>
<rect x="360" y="230" width="280" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<text x="500" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#042C53">pfSense VM (pve01)</text>
<text x="500" y="274" text-anchor="middle" font-size="12" fill="#185FA5">+ WireGuard remote-access VPN</text>
</g>

<g>
<rect x="360" y="330" width="280" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="500" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#2C2C2A">Cisco Catalyst switch</text>
<text x="500" y="374" text-anchor="middle" font-size="12" fill="#5F5E5A">802.1Q trunk</text>
</g>

<g>
<rect x="50" y="430" width="210" height="220" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="155" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#2C2C2A">MGMT10</text>
<text x="155" y="485" text-anchor="middle" font-size="12" fill="#5F5E5A">(mgmt)</text>
</g>

<g>
<rect x="280" y="430" width="210" height="220" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<text x="385" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#042C53">INFRA20</text>
<text x="385" y="485" text-anchor="middle" font-size="12" fill="#0C447C">Docker / Wazuh</text>
<text x="385" y="505" text-anchor="middle" font-size="12" fill="#0C447C">Suricata</text>
<text x="385" y="525" text-anchor="middle" font-size="12" fill="#0C447C">Shuffle / n8n</text>
<text x="385" y="545" text-anchor="middle" font-size="12" fill="#0C447C">entra-connect-01</text>
<text x="385" y="565" text-anchor="middle" font-size="12" fill="#0C447C">+ pve-ai inference</text>
</g>

<g>
<rect x="510" y="430" width="210" height="220" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="615" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#4A1B0C">RANGE30</text>
<text x="615" y="485" text-anchor="middle" font-size="12" fill="#712B13">Kali</text>
<text x="615" y="505" text-anchor="middle" font-size="12" fill="#712B13">Win11-LTSC-victim</text>
<text x="615" y="525" text-anchor="middle" font-size="12" fill="#712B13">win11-ws02</text>
<text x="615" y="545" text-anchor="middle" font-size="12" fill="#712B13">dc01</text>
<text x="615" y="565" text-anchor="middle" font-size="12" fill="#712B13">linux-victim</text>
<text x="615" y="585" text-anchor="middle" font-size="12" fill="#712B13">+ phantom computer objects</text>
</g>

<g>
<rect x="740" y="430" width="210" height="220" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="845" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#04342C">SPAN monitor</text>
<text x="845" y="485" text-anchor="middle" font-size="12" fill="#085041">Mirrors Range traffic</text>
<text x="845" y="505" text-anchor="middle" font-size="12" fill="#085041">-&gt; Suricata</text>
<text x="845" y="525" text-anchor="middle" font-size="12" fill="#085041">passive / no IP</text>
</g>

</svg>
